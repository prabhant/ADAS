  nemotron-3-nano-30b:
    hf_id: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
    source: managed
    family: nvidia
    architecture: moe
    params_total: 31.58
    params_active: 3.58
    roles: [meta, worker]
    tensor_parallel_size: 1
    gpus: 1
