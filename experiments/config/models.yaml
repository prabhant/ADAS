# Held-out models. Never used as meta or worker, so that judging and embedding
# cannot correlate with the axis under study.
held_out:
  embedding:
    hf_id: sentence-transformers/all-MiniLM-L6-v2
    source: self_download        # not in the managed cache
    used_by: [analysis/prompt_semantics.py, analysis/lineage.py]
  judge:
    hf_id: mistralai/Mixtral-8x7B-Instruct-v0.1
    # Serve with models.mixtral-8x7b's model_path and serve_args: refs/main has
    # no weights, and that snapshot's chat template rejects a system message.
    source: managed
    checkpoint_gb: 87
    tensor_parallel_size: 2
    max_model_len: 32768
    used_by: [analysis/designer_signature.py]
    fallback: mistralai/Mistral-7B-Instruct-v0.3
    note: >
      Runs in its own analysis job so it may take two GPUs without competing
      with a search. Held out from both ladders; promoting it to a ladder rung
      would stop the thought-code alignment scores from being independent.

# ---------------------------------------------------------------------------
# Excluded, with the reason, so the sizing is not re-litigated later.
# ---------------------------------------------------------------------------
excluded:
  # --- too large to co-reside with a worker on one node ---
  qwen3.5-397b-a17b: 752GB; needs two full H100 nodes
  qwen3.5-122b-a10b: 234GB bf16; tp=4 consumes the node, leaving none for the worker
  mixtral-8x22b-instruct-v0.1: 262GB; tp=4 consumes the node
  deepseek-r1: 642-700GB, two full H100 nodes
  deepseek-v3.2: 642-700GB, two full H100 nodes
  qwen2.5-72b-instruct: 145GB; would fit as meta at tp=2 but is a 2024 model

  # --- context too short ---
  phi-2: 2k context; cannot hold an agent scaffold, let alone the meta prompt
  phi-3-mini-4k / phi-3-medium-4k: 4k context; the 128k variants cost the same
  gpt-j / gpt-neox / gpt-2: 2k context, obsolete
  phi-4-as-meta: 16k context; fails by mid-run once the archive grows

  # --- base models, no chat template ---
  mistral-7b-v0.1: base model; the framework assumes a chat endpoint
  mixtral-8x7b-v0.1 / mixtral-8x22b-v0.1: base models; use the Instruct variants

  # --- wrong modality ---
  phi-3-vision-128k: vision-language; no text-only gain over phi-3-medium
  videollama3-7b / llava-video-7b: video understanding
  whisper-large-v3: speech recognition

  # --- planned earlier, corrected against the actual cache ---
  qwen3-4b: not in the managed catalogue; the cache carries Qwen3.5, not Qwen3-4B
  qwen3-27b-instruct: does not exist; the managed entry is Qwen/Qwen3.5-27B
  mistral-small-3.2-24b: not in the cache; judge role moved to Mixtral-8x7B-Instruct
  llama-2 / codellama-2: gated and superseded
