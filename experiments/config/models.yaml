# Model registry for the ADAS scaling study.
#
# Every `source: managed` entry was verified present in the Snellius managed
# cache by directory listing, so none of them need a download or a servicedesk
# ticket. `hf_id` is the exact repo id; the cache directory is
# models--<hf_id with / replaced by -->.
#
# THE BINDING CONSTRAINT IS VRAM PER NODE, NOT DISK.
# One gpu_h100 node is 4 x H100 94GB, and meta + worker must share it. That caps
# the meta agent at tensor_parallel_size 2 whenever the worker needs more than
# one GPU, and rules out every checkpoint above ~180GB as a meta agent no matter
# how capable it is. `checkpoint_gb` is the on-disk size; `vram_gb` is the
# serving estimate including KV cache. Where the two could diverge the entry
# carries `verify: true` and must be confirmed by the Stage 0 sanity jobs.
#
# `roles` restricts which side of the experiment a model may be used on.
# `params_total` / `params_active`: billions of language-model parameters,
# embeddings included, vision towers and MTP heads excluded, counted from the
# checkpoint headers so all models share one convention. Vendor figures do not
# (OpenAI's 3.6B / 5.1B active for gpt-oss leave out the embeddings).
# `max_output_tokens` is the *usable* completion budget and is calibrated per
# model so that reasoning-trace emitters are not silently starved relative to
# non-reasoning models (see "Fairness controls" in followinstructions.md).

defaults:
  managed_cache: /projects/2/managed_datasets/hf_cache_dir
  dtype: bfloat16
  gpu_memory_utilization: 0.90
  api_key: local-vllm
  node_vram_gb: 376              # 4 x H100 94GB, shared between the two roles

# Exactly the variables the SURF documentation prescribes. HF_HOME must not
# point into the managed cache: it is read-only and the hub writes locks there.
# Snellius does not export login-shell variables into jobs, so every job script
# has to set these itself.
hf_env:
  HF_HUB_CACHE: /projects/2/managed_datasets/hf_cache_dir
  HF_HOME: /scratch-shared/$USER/hf
  HF_HUB_OFFLINE: 1
  vllm_flag: --download-dir $HF_HUB_CACHE

models:
  gpt-oss-20b:
    hf_id: openai/gpt-oss-20b
    source: managed
    params_total: 20.91
    params_active: 4.19
    architecture: moe
    context: 131072
    license: Apache-2.0
    roles: [meta, worker]
    tensor_parallel_size: 1
    gpus: 1
    max_model_len: 131072
    max_output_tokens: 8192        # doubled: reasoning trace shares the budget
    emits_reasoning: true
    supports_reasoning_effort: true
    reasoning_efforts: [low, medium, high]
    ladder: meta_floor

  qwen3.5-27b:
    hf_id: Qwen/Qwen3.5-27B
    source: managed
    family: qwen
    params_total: 26.9
    params_active: 26.9
    architecture: dense
    context: 131072
    license: Apache-2.0
    checkpoint_gb: 52
    vram_gb: 62
    roles: [meta, worker]
    tensor_parallel_size: 1
    gpus: 1
    max_model_len: 65536
    max_output_tokens: 4096
    meta_reasoning_parser: qwen3   # meta only: lets it think before the JSON grammar applies
    emits_reasoning: false
    supports_reasoning_effort: false
    ladder: [meta_mid, worker_large]
    verify: true                   # confirm native context and chat template

  gpt-oss-120b:
    hf_id: openai/gpt-oss-120b
    source: managed
    family: openai
    params_total: 116.83
    params_active: 5.71
    architecture: moe
    context: 131072
    license: Apache-2.0
    checkpoint_gb: 183             # repo total: bf16 AND mxfp4 copies
    vram_gb: 75                    # served weights are mxfp4, 65GB (checked in config.json)
    roles: [meta]
    tensor_parallel_size: 2
    gpus: 2
    max_model_len: 131072
    max_output_tokens: 8192
    emits_reasoning: true
    supports_reasoning_effort: true
    reasoning_efforts: [low, medium, high]
    stage_to_node_nvme: true       # $TMPDIR with --constraint=scratch-node
    ladder: meta_top
    fallback: nemotron-3-super-120b

  nemotron-3-super-120b:
    hf_id: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
    source: managed
    family: nvidia
    params_total: 120.67
    params_active: 12.77
    architecture: moe
    context: 131072
    license: nvidia-open-model
    checkpoint_gb: 120             # already FP8, so disk ~= VRAM
    vram_gb: 140
    roles: [meta]
    tensor_parallel_size: 2
    gpus: 2
    max_model_len: 65536
    max_output_tokens: 8192
    meta_reasoning_parser: nemotron_v3
    emits_reasoning: true
    supports_reasoning_effort: false
    ladder: meta_top_alternate
    verify: true                   # confirm FP8 kernel support in this vLLM

  mistral-7b:
    hf_id: mistralai/Mistral-7B-Instruct-v0.2
    source: managed
    family: mistral
    params_total: 7.24
    params_active: 7.24
    architecture: dense
    context: 32768
    license: Apache-2.0
    checkpoint_gb: 14
    vram_gb: 20
    roles: [worker]
    tensor_parallel_size: 1
    gpus: 1
    max_model_len: 32768
    max_output_tokens: 4096
    emits_reasoning: false
    supports_reasoning_effort: false
    ladder: worker_small
    # Chosen for the low rung over the smaller Phi-3-mini despite being larger:
    # it is much weaker at grade-school maths, which widens the capability span,
    # and it keeps all three worker rungs in different model families so that
    # capability is not confounded with training recipe.

  phi-4:
    hf_id: microsoft/phi-4
    source: managed
    family: microsoft
    params_total: 14.66
    params_active: 14.66
    architecture: dense
    context: 16384
    license: MIT
    checkpoint_gb: 28
    vram_gb: 36
    roles: [worker]                # 16k context: unusable as a meta agent
    tensor_parallel_size: 1
    gpus: 1
    max_model_len: 16384
    max_output_tokens: 4096
    emits_reasoning: false
    supports_reasoning_effort: false
    ladder: worker_mid

  # --- screen candidates (batch 1). Sizes from config.json in the managed cache.

  mistral-7b-v0.3:
    hf_id: mistralai/Mistral-7B-Instruct-v0.3
    source: managed
    family: mistral
    roles: [meta, worker]
    tensor_parallel_size: 1
    gpus: 1
    max_model_len: 32768
    max_output_tokens: 4096

  mixtral-8x7b:
    hf_id: mistralai/Mixtral-8x7B-Instruct-v0.1
    # refs/main points at a snapshot with no weights; serve this one by path.
    model_path: /projects/2/managed_datasets/hf_cache_dir/models--mistralai--Mixtral-8x7B-Instruct-v0.1/snapshots/1e637f2d7cb0a9d6fb1922f305cb784995190a83
    # That snapshot's chat template rejects a system message (HTTP 400); the
    # newer snapshot's tokenizer accepts one.
    serve_args: --tokenizer /projects/2/managed_datasets/hf_cache_dir/models--mistralai--Mixtral-8x7B-Instruct-v0.1/snapshots/bbae113847402a22031211225b5ee45c005de7dd
    source: managed
    family: mistral
    roles: [judge]                 # the held-out judge (decided 2026-10-13), so never a designer
    tensor_parallel_size: 2
    gpus: 2
    max_model_len: 32768
    max_output_tokens: 4096

  phi-3-mini-128k:
    hf_id: microsoft/Phi-3-mini-128k-instruct
    source: managed
    family: microsoft
    roles: [meta, worker]
    tensor_parallel_size: 1
    gpus: 1
    max_model_len: 32768
    max_output_tokens: 4096

  phi-3-medium-128k:
    hf_id: microsoft/Phi-3-medium-128k-instruct
    source: managed
    family: microsoft
    roles: [meta, worker]
    tensor_parallel_size: 1
    gpus: 1
    max_model_len: 32768
    max_output_tokens: 4096

  qwen3-14b:
    hf_id: Qwen/Qwen3-14B
    source: managed
    family: qwen
    architecture: dense
    params_total: 14.77
    params_active: 14.77
    roles: [meta]                  # returns empty answers as a worker
    tensor_parallel_size: 1
    gpus: 1
    max_model_len: 40960
    max_output_tokens: 4096
    meta_reasoning_parser: qwen3

  qwen3-30b-a3b:
    hf_id: Qwen/Qwen3-30B-A3B
    source: managed
    family: qwen
    architecture: moe
    params_total: 30.53
    params_active: 3.35
    roles: [meta, worker]
