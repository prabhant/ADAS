# Model registry for the GitHub Copilot SDK arm of the ADAS study.
#
# Kept apart from models.yaml on purpose: the SLURM resolver (_common.sh) and the
# vLLM tooling read every entry there as a servable checkpoint (hf_id, tensor
# parallelism, max_model_len). Nothing here is served locally.
#
# KEYS ARE THE COPILOT MODEL IDS. search.py receives the key as --model /
# --worker_model, the gateway allowlists it, and analysis/aggregate.py falls back
# to the key as the model identifier, so a cell's seeds and designs group under
# one name with no mapping table.
#
# `verified: true` means the id is offered to this account, its policy is enabled,
# and `pricing` equals the account's own models.list price table (which reports
# AI credits per 1M tokens). Checked 2026-10-29 with
#     python experiments/serving/copilot_probe.py inventory
# Rerun it before a new phase: offers and promotional prices change.
#
# `pricing` is USD per 1M tokens from
# https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing
# (retrieved 2026-10-28; promotional prices expire). 1 AI credit = $0.01. The
# gateway charges max(Copilot-reported cost, this estimate), so a stale price can
# only make the budget stricter, never looser.
#
# There are no parameter counts: vendors do not publish them. The designer-size
# axis (Q8) is `tier` within a `family` (lightweight < versatile < powerful),
# and price as a continuous proxy.
#
# `max_output_tokens` is what search.py passes as max_tokens. It is only applied
# when the gateway runs with --honor_max_tokens (verified in Phase 0).

defaults:
  ai_credit_usd: 0.01
  reasoning_effort_values: [low, medium, high, xhigh, max]

models:
  claude-haiku-5.5:
    display_name: Claude Haiku 5.5
    family: anthropic
    tier: lightweight
    roles: [meta, worker]
    verified: true
    max_output_tokens: 4096
    meta_max_output_tokens: 16384
    pricing:
      input: 0.10
      cached_input: 0.01
      cache_write: 0.125
      output: 0.50
      long_context_threshold: 100000   # the designer prompt crosses this late in a run
      long_input: 0.50
      long_cached_input: 0.05
      long_cache_write: 0.625
      long_output: 2.50

  claude-haiku-4.5:
    display_name: Claude Haiku 4.5
    family: anthropic
    tier: versatile
    roles: [worker]
    verified: true
    max_output_tokens: 4096
    pricing: {input: 1.00, cached_input: 0.10, cache_write: 1.25, output: 5.00}

  claude-sonnet-5.5:
    display_name: Claude Sonnet 5.5
    family: anthropic
    tier: versatile
    roles: [meta, worker]
    verified: true
    max_output_tokens: 4096
    meta_max_output_tokens: 16384
    pricing: {input: 2.00, cached_input: 0.10, cache_write: 2.50, output: 10.00}

  claude-opus-5.5:
    display_name: Claude Opus 5.5
    family: anthropic
    tier: powerful
    roles: [meta, worker]
    verified: true
    max_output_tokens: 4096
    meta_max_output_tokens: 16384
    pricing: {input: 4.00, cached_input: 0.20, cache_write: 5.00, output: 20.00}

  gpt-6-luna:
    display_name: GPT-6 Luna
    family: openai
    tier: lightweight
    roles: [meta, worker]
    verified: true
    max_output_tokens: 4096
    meta_max_output_tokens: 16384
    pricing:
      input: 0.10
      cached_input: 0.01
      cache_write: 0.125
      output: 0.50
      long_context_threshold: 272000
      long_input: 0.20
      long_cached_input: 0.02
      long_cache_write: 0.25
      long_output: 0.75

  # Replaces GPT-5.4 nano, which this account is not offered: the previous-generation
  # lightweight OpenAI model, as the screen's likely-weaker worker.
  gpt-5.6-luna:
    display_name: GPT-5.6 Luna
    family: openai
    tier: lightweight
    roles: [worker]
    verified: true
    max_output_tokens: 4096
    pricing:
      input: 0.20
      cached_input: 0.02
      cache_write: 0.25
      output: 1.20
      long_context_threshold: 200000
      long_input: 0.40
      long_cached_input: 0.04
      long_cache_write: 0.50
      long_output: 1.80

  gpt-6.1-terra:
    display_name: GPT-6.1 Terra
    family: openai
    tier: versatile
    roles: [meta, worker]
    verified: false                # offered, but no policy state: enable it before use
    max_output_tokens: 4096
    meta_max_output_tokens: 16384
    pricing:
      input: 1.00
      cached_input: 0.05
      cache_write: 1.25
      output: 5.00
      long_context_threshold: 272000
      long_input: 2.00
      long_cached_input: 0.10
      long_cache_write: 2.50
      long_output: 7.50

  gpt-6.1-sol:
    display_name: GPT-6.1 Sol
    family: openai
    tier: powerful
    roles: [meta, worker]
    verified: true
    max_output_tokens: 4096
    meta_max_output_tokens: 16384
    pricing:
      input: 2.00
      cached_input: 0.10
      cache_write: 2.50
      output: 10.00
      long_context_threshold: 272000
      long_input: 4.00
      long_cached_input: 0.20
      long_cache_write: 5.00
      long_output: 15.00
